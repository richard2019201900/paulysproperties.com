<style>
/* Site Switcher Glow Animation - Gold/Amber theme for Autos */
.site-switcher-glow {
    animation: siteSwitcherPulse 3s ease-in-out infinite;
}

@keyframes siteSwitcherPulse {
    0%, 100% {
        box-shadow: 0 0 5px rgba(212, 175, 55, 0.3), 0 0 10px rgba(212, 175, 55, 0.2);
    }
    50% {
        box-shadow: 0 0 15px rgba(212, 175, 55, 0.5), 0 0 25px rgba(212, 175, 55, 0.3);
    }
}

.site-switcher-glow:hover {
    animation: none;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.6), 0 0 30px rgba(212, 175, 55, 0.4);
}
</style>

<!--
  ============================================
  STEP 3: Add this JavaScript to your ui.js (near other dropdown functions)
  ============================================
-->

<script>
// ==================== SITE SWITCHER ====================
// Toggle site switcher dropdown
window.toggleSiteSwitcher = function() {
    const dropdown = document.getElementById('siteSwitcherDropdown');
    const arrow = document.getElementById('siteSwitcherArrow');
    
    if (dropdown) {
        dropdown.classList.toggle('hidden');
        if (arrow) {
            arrow.classList.toggle('rotate-180');
        }
    }
    
    // Close user dropdown if open
    const userDropdown = document.getElementById('userDropdownMenu');
    if (userDropdown && !userDropdown.classList.contains('hidden')) {
        userDropdown.classList.add('hidden');
    }
};

// Close site switcher dropdown
window.closeSiteSwitcher = function() {
    const dropdown = document.getElementById('siteSwitcherDropdown');
    const arrow = document.getElementById('siteSwitcherArrow');
    if (dropdown) {
        dropdown.classList.add('hidden');
        if (arrow) arrow.classList.remove('rotate-180');
    }
};

// Add to your existing document click listener (or create one)
// This closes the site switcher when clicking outside
document.addEventListener('click', function(e) {
    const siteSwitcherContainer = document.getElementById('siteSwitcherContainer');
    const siteSwitcherDropdown = document.getElementById('siteSwitcherDropdown');
    if (siteSwitcherContainer && siteSwitcherDropdown && !siteSwitcherContainer.contains(e.target)) {
        siteSwitcherDropdown.classList.add('hidden');
        const arrow = document.getElementById('siteSwitcherArrow');
        if (arrow) arrow.classList.remove('rotate-180');
    }
});
</script>

<!--
  ============================================
  NOTES:
  ============================================
  
  1. The dropdown works on both desktop and mobile
  2. Clicking outside closes the dropdown
  3. The arrow rotates 180° when dropdown is open
  4. The glow animation pulses subtly and stops on hover
  5. Current site is highlighted with a border and checkmark
  6. Other site shows an arrow icon on hover
  
  Colors used:
  - Autos (gold/amber): #D4AF37, amber-400, amber-500
  - Properties (purple): #8B5CF6, purple-400, purple-500
-->
